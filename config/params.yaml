main:
  # GPIO pins
  BUTTON_LEFT_GPIO_PIN: 21
  BUTTON_RIGHT_GPIO_PIN: 19
  LED_RED_GPIO_PIN: 12
  LED_BLUE_GPIO_PIN: 16
  LED_GREEN_GPIO_PIN: 13

  # PCA9685 / servo channels
  PCA9685_ADDR: 0x40
  PCA9685_FREQ: 50
  SERVO_CENTER_CHANNEL: 11
  SERVO_LEFT_CHANNEL: 9
  SERVO_RIGHT_CHANNEL: 10

  # Servo pulse width calibration, in microseconds (0 deg / 180 deg)
  SERVO_CENTER_MIN_PULSE_US: 500
  SERVO_CENTER_MAX_PULSE_US: 2700
  SERVO_LEFT_MIN_PULSE_US: 500
  SERVO_LEFT_MAX_PULSE_US: 2700
  SERVO_RIGHT_MIN_PULSE_US: 500
  SERVO_RIGHT_MAX_PULSE_US: 2700

  # Main loop
  MAIN_LOOP_DELAY_MS: 100

control:
  balance_controller:
    # Platform known values
    ARM_DIST_FROM_CENTER: 55
    ARM_TO_ARM_DIST: 95

    # Servo arm known values
    AXIS_OFFSET: 30.0
    LOWER_ARM_LENGTH: 45.0
    UPPER_ARM_LENGTH: 98.0

    # Servo offset so lower arm point up is defined as 0 degs
    SERVO_CENTER_REFERENCE_OFFSET: 34
    SERVO_LEFT_REFERENCE_OFFSET: 45.0
    SERVO_RIGHT_REFERENCE_OFFSET: 39.0

    # Servo idle mode angles in mm
    SERVO_CENTER_IDLE_HEIGHT: 75.0 # 65 # TODO change back
    SERVO_LEFT_IDLE_HEIGHT: 75.0  # 68
    SERVO_RIGHT_IDLE_HEIGHT: 75.0 #68

    # Platform ready mode values in mm
    PLATFORM_READY_HEIGHT: 115.0
    PLATFORM_READY_ROLL: 0.0
    PLATFORM_READY_PITCH: 0.0

    # Runner thread 
    BALANCE_CONTROLLER_THREAD_DELAY_MS: 10

    # Kalman filter values (1D constant-velocity, one filter per axis)
    # process noise = how much we trust the constant-velocity model between frames
    # measurement noise = how noisy the raw camera-derived position reading is
    # starting points only -- tune per-axis on hardware
    KALMAN_X_PROCESS_NOISE_POS: 0.00001 # 0.01
    KALMAN_X_PROCESS_NOISE_VEL: 0.2  # 0.5
    KALMAN_X_MEASUREMENT_NOISE: 0.00000136

    KALMAN_Y_PROCESS_NOISE_POS: 0.00001
    KALMAN_Y_PROCESS_NOISE_VEL: 0.2  #0.025
    KALMAN_Y_MEASUREMENT_NOISE: 0.00000050

    KALMAN_RADIUS_PROCESS_NOISE_POS: 0.0000001
    KALMAN_RADIUS_PROCESS_NOISE_VEL: 0.0005
    KALMAN_RADIUS_MEASUREMENT_NOISE: 0.00000003

    PID_ANTI_WINDUP: true
    PID_ANTI_WINDUP_THRESHOLD: 0.1

    # PID gains and clamp values
    PID_ROLL_KP: 7.2 #5.9 , 6.1, 6.1, 7.2
    PID_ROLL_KI: 0.0 
    PID_ROLL_KD: 3.8 #4.1 , 4.15, 3.8, 3.8
    PID_ROLL_MIN: -35.0
    PID_ROLL_MAX: 35.0

    PID_PITCH_KP: 7.85 # 7.85 
    PID_PITCH_KI: 0.0 
    PID_PITCH_KD: 4.15 # 4.15 
    PID_PITCH_MIN: -35.0
    PID_PITCH_MAX: 35.0

    PID_HEIGHT_KP: 300.0
    PID_HEIGHT_KI: 0.0
    PID_HEIGHT_KD: 0.0
    PID_HEIGHT_MIN: -5.0
    PID_HEIGHT_MAX: 15.0
    PID_HEIGHT_THRESHOLD: 0.05

    TARGET_RADIUS: 0.14
    
    PID_ROLL_DERIVATIVE_DEADBAND: 0.0 # 0.4
    PID_PITCH_DERIVATIVE_DEADBAND: 0.0 # 0.4
    PID_HEIGHT_DERIVATIVE_DEADBAND: 0.15 # 0.4

    PID_ROLL_DERIVATIVE_DEADBAND_MULTI: 1.0 # 0.4
    PID_PITCH_DERIVATIVE_DEADBAND_MULTI: 1.0 # 0.4
    PID_HEIGHT_DERIVATIVE_DEADBAND_MULTI: 1.0 # 0.4


