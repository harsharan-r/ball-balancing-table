main:
  # GPIO pins
  BUTTON_LEFT_GPIO_PIN: 21
  BUTTON_RIGHT_GPIO_PIN: 19
  LED_RED_GPIO_PIN: 12
  LED_BLUE_GPIO_PIN: 16
  LED_GREEN_GPIO_PIN: 13

  # PCA9685 / servo channels
  PCA9685_ADDR: 0x40
  PCA9685_FREQ: 50
  SERVO_CENTER_CHANNEL: 11
  SERVO_LEFT_CHANNEL: 9
  SERVO_RIGHT_CHANNEL: 10

  # Servo pulse width calibration, in microseconds (0 deg / 180 deg)
  SERVO_CENTER_MIN_PULSE_US: 500
  SERVO_CENTER_MAX_PULSE_US: 2700
  SERVO_LEFT_MIN_PULSE_US: 500
  SERVO_LEFT_MAX_PULSE_US: 2700
  SERVO_RIGHT_MIN_PULSE_US: 500
  SERVO_RIGHT_MAX_PULSE_US: 2700

  # Main loop
  MAIN_LOOP_DELAY_MS: 100

control:
  balance_controller:
    # Platform known values
    ARM_DIST_FROM_CENTER: 55
    ARM_TO_ARM_DIST: 95

    # Servo arm known values
    AXIS_OFFSET: 30.0
    LOWER_ARM_LENGTH: 45.0
    UPPER_ARM_LENGTH: 98.0

    # Servo offset so lower arm point up is defined as 0 degs
    SERVO_CENTER_REFERENCE_OFFSET: 38.0
    SERVO_LEFT_REFERENCE_OFFSET: 46.0
    SERVO_RIGHT_REFERENCE_OFFSET: 42.0

    # Servo idle mode angles in mm
    SERVO_CENTER_IDLE_HEIGHT: 75.0 # 65 # TODO change back
    SERVO_LEFT_IDLE_HEIGHT: 75.0  # 68
    SERVO_RIGHT_IDLE_HEIGHT: 75.0 #68

    # Platform ready mode values in mm
    PLATFORM_READY_HEIGHT: 100.0
    PLATFORM_READY_ROLL: 0.0
    PLATFORM_READY_PITCH: 0.0

    # Runner thread 
    BALANCE_CONTROLLER_THREAD_DELAY_MS: 10

    # Filter values
    ALPHA_X: 0.35 #0.6
    ALPHA_Y: 0.35 #0.6
    ALPHA_RADIUS: 0.35 #0.6

